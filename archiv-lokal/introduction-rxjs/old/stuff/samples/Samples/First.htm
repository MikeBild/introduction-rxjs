<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
	<head>
		<title></title>
		<script src="Scripts/jquery-1.7.2.min.js"></script>
	    <script src="Scripts/rx.min.js"></script>
	    <script src="Scripts/rx.jquery.min.js"></script>
	</head>
    <body>
        <input type="button" value="Click Me" id="clickButton"/>
        <script>
            $("#clickButton").clickAsObservable().subscribe(function (x) { console.log("Test"); });
            $(document).keyupAsObservable().subscribe(function (x) { console.log(String.fromCharCode(x.keyCode)); });
        </script>
	
    </body>
</html>
