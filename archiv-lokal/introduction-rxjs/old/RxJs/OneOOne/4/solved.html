<!DOCTYPE html>
<head>
    <title>RxJs!</title>
    <script src="./libs/jquery-1.7.2.min.js" type="text/javascript"></script>
    <script src="./libs/rx.min.js" type="text/javascript"></script>
    <script src="./libs/rx.jquery.min.js" type="text/javascript"></script>
    <script src="./libs/rx.time.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(function() {
            var subscription1 = Rx.Observable.fromArray([1,2,3,4,5,6,7,8,9,0]);
            var subscription2 = Rx.Observable.fromArray([1,2,3,4,5,6,"sieben",8,9,0]);

            subscription1
                    .doAction(function(x) {
                        if(x==7) throw "Verflixte Sieben!";
                    })
                    //.catchException(function(error) { console.log("Error catched"); return Rx.Observable.returnValue(7); })
                    .doAction(function(next) {
                    }, function(error) {
                        console.log("Error in stream: " + error);
                    })
                    .retry(2)
                    .onErrorResumeNext(subscription1)
                    .doAction(function(next) {
                        console.log("Value in stream: " + next);
                    }, function(error) {
                        console.log("Error in stream: " + error);
                    }, function() {
                        console.log("Stream completed");
                    })
                    .subscribe();
        });
    </script>
</head>

<body style="font-family: Consolas, monospace; overflow: hidden">
<div id="result"></div>
</body>
</html>
