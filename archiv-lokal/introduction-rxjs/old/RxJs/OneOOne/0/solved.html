<!DOCTYPE html>
    <head>
        <title>RxJs!</title>   
        <script src="./libs/jquery-1.7.2.min.js" type="text/javascript"></script>
        <script src="./libs/rx.min.js" type="text/javascript"></script>
        <script src="./libs/rx.jquery.min.js" type="text/javascript"></script>
		<script src="./libs/rx.time.min.js" type="text/javascript"></script>
        <script type="text/javascript">
		$(function() {
			var subscription1 = Rx.Observable.returnValue(101);
            var subscription2 = Rx.Observable.generate(
                    1,
                    function(x) {return x<=10;},
                    function(x) {return x+1;},
                    function(x) {return x;}
            );
			subscription1
                .select(function(x) {
                    return x.toString()
                })
                .subscribe(function(x) {
                    $("#result1").text("Value is: " + x);
                });
            subscription2
                    .select(function(x) {
                        return x.toString()
                    })
                    .subscribe(function(x) {
                        $("#result2").append(x + ",");
                    });

             subscription2
                     .toArray()
                     .subscribe(function(values) {
                          for(var value in values)
                          {
                              $("#result3").append(value);
                          }
                     });

            subscription2
                    .skip(3)
                    .take(2)
                    .subscribe(function(x) {
                            $("#result4").append(" " + x);
                    });
        });
        </script>
    </head>

    <body style="font-family: Consolas, monospace; overflow: hidden">
        <h1>Return single value</h1>
		<div id="result1"></div>
        <h1>Generate</h1>
        <div id="result2"></div>
        <h1>toArray</h1>
        <div id="result3"></div>
        <h1>Skip, Take, First, Last</h1>
        <div id="result4"></div>
    </body>
</html>
