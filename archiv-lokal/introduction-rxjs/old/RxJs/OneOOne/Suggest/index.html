<!DOCTYPE html>
    <head>
        <title>RxJs!</title>   
        <script src="./libs/jquery-1.7.2.min.js" type="text/javascript"></script>
        <script src="./libs/rx.min.js" type="text/javascript"></script>
        <script src="./libs/rx.jquery.min.js" type="text/javascript"></script>
		<script src="./libs/rx.time.min.js" type="text/javascript"></script>
        <script type="text/javascript">
			function searchWikipedia (term) {
				return $.ajaxAsObservable({
					url: 'http://de.wikipedia.org/w/api.php',
					dataType: 'jsonp',
					data: {
						action: 'opensearch',
						format: 'json',
						search: encodeURI(term)
					}
				});
			}
            
			$(function () {
				var input = $('#textInput');
				var ul = $('#results');
				
				var keyup = input
                        .keyupAsObservable().select(function(ev) {
						return ev.target.value;
					}).where(function(text) {
						return text.length > 2;
					}).throttle(200)
					.distinctUntilChanged();

				var searcher = keyup.select(function (text) {
						$("#spinner").show();
						return searchWikipedia(text);
					}).switchLatest()
					.where(function (value) {
						return value.data.length === 2; 
					});

				searcher.subscribe(function (value) {                    
					var results = value.data[1];
					ul.empty();
					$.each(results, function (_, result) {
						$('<li>', { text: result, }).appendTo(ul);
					});
					$("#spinner").hide();
				}, function (error) {
					ul.empty();
					$('<li>', { text: 'Error: ' + error.errorThrown }).appendTo(ul);
				});

			});                
        </script>
    </head>

    <body style="font-family: Consolas, monospace; overflow: hidden">
        <input type="text" id="textInput"></input>
		<span id="spinner" style="display:none;">
			<img id="img-spinner" src="img/ajax-loader.gif" alt="Loading"/>
		</span>
        <ul id="results"></ul>
    </body>
</html>
