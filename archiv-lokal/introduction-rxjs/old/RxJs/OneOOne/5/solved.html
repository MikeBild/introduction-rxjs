<!DOCTYPE html>
<head>
    <title>RxJs!</title>
    <script src="./libs/jquery-1.7.2.min.js" type="text/javascript"></script>
    <script src="./libs/rx.min.js" type="text/javascript"></script>
    <script src="./libs/rx.jquery.min.js" type="text/javascript"></script>
    <script src="./libs/rx.time.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(function() {
            var inputSubscription = $("#inputText")
                    .keyupAsObservable()
                    .select(function(x) {
                        return x.target.value;
                    })
                    .publish();

            var result1Stream = inputSubscription.doAction(function(x) { $("#result1").text(x); });
            var result1Subscribtion = result1Stream.subscribe();

            var result2Stream = inputSubscription.doAction(function(x) { $("#result2").text(x); });
            var result2Subscribtion = result2Stream.subscribe();

            $("#toggle1Subscription")
                    .clickAsObservable()
                    .doAction(function(x) {
                        var button = $("#toggle1Subscription");
                        if(button.val() != "Subscribe") {
                            button.val("Subscribe");
                            result1Subscribtion.dispose();
                        } else {
                            button.val("Unsubscribe");
                            result1Subscribtion = result1Stream.subscribe();
                        }
                    })
                    .subscribe();
            $("#toggle2Subscription")
                    .clickAsObservable()
                    .doAction(function(x) {
                        var button = $("#toggle2Subscription");
                        if(button.val() != "Subscribe") {
                            button.val("Subscribe");
                            result2Subscribtion.dispose();
                        } else {
                            button.val("Unsubscribe");
                            result2Subscribtion = result2Stream.subscribe();
                        }
                    })
                    .subscribe();
            inputSubscription.connect();
        });
    </script>
</head>

<body style="font-family: Consolas, monospace; overflow: hidden">
<div><input type="text" id="inputText"></div>
<div><div id="result1">Empty</div><input type="button" id="toggle1Subscription" value="Unsubscribe"></div>
<div><div id="result2">Empty</div><input type="button" id="toggle2Subscription" value="Unsubscribe"></div>
</body>
</html>
