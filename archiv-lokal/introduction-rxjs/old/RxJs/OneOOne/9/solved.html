<!DOCTYPE html>
<head>
    <title>RxJs!</title>
    <script src="./libs/jquery-1.7.2.min.js" type="text/javascript"></script>
    <script src="./libs/rx.min.js" type="text/javascript"></script>
    <script src="./libs/rx.jquery.min.js" type="text/javascript"></script>
    <script src="./libs/rx.time.min.js" type="text/javascript"></script>
    <script src="./libs/rx.joinpatterns.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(function() {
            var firstButton = $("#first").clickAsObservable();
            var secondButton = $("#second").clickAsObservable();
            var thirdButton = $("#third").clickAsObservable();


            var plan1 = firstButton
                    .and(secondButton)
                    .then(function(x,y) {
                        return "First + Second pressed";
                    });


            var plan2 = secondButton
                    .and(thirdButton)
                    .then(function(x,y) {
                        return "Second + Third pressed";
                    });

            Rx.Observable
                    .when(plan1, plan2)
                    .doAction(function(x){
                        console.log(x);
                    })
                    .subscribe();

        });
    </script>
</head>

<body style="font-family: Consolas, monospace;">
<input type="button" value="First" id="first"/>
<input type="button" value="Second" id="second"/>
<input type="button" value="Third" id="third"/>
</body>
</html>
