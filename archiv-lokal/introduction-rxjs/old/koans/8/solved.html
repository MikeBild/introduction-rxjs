<!DOCTYPE html>
<head>
    <title>RxJs!</title>
    <script src="./libs/jquery-1.7.2.min.js" type="text/javascript"></script>
    <script src="./libs/rx.min.js" type="text/javascript"></script>
    <script src="./libs/rx.jquery.min.js" type="text/javascript"></script>
    <script src="./libs/rx.time.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        var command = function(name, value){
            var self = this;
            self.command = name;
            self.value = value;
            self.timestamp = new Date();
        };
        var subject = new Rx.Subject();
        $(function() {
            subject.where(function(x){
                return x.command == 'doCommand';
            })
            .doAction(function(x) {
                alert("Click was pressed. Value: " + x.value + " at " + x.timestamp);
            })
            .subscribe();

            subject.where(function(x){
                return x.command == 'doCommand2';
            })
            .doAction(function(x) {
                alert("Click 2 was pressed. Value: " + x.value + " at " + x.timestamp);
            })
            .subscribe();

        });
    </script>
</head>

<body style="font-family: Consolas, monospace;">
<input type="button" onclick="subject.onNext(new command('doCommand', 'Test'))" value="Click here"/>
<input type="button" onclick="subject.onNext(new command('doCommand2', 'Test'))" value="Click here 2"/>
</body>
</html>
