<!DOCTYPE html>
<head>
    <title>RxJs!</title>
    <script src="./libs/jquery-1.7.2.min.js" type="text/javascript"></script>
    <script src="./libs/rx.min.js" type="text/javascript"></script>
    <script src="./libs/rx.jquery.min.js" type="text/javascript"></script>
    <script src="./libs/rx.time.min.js" type="text/javascript"></script>
    <script src="./libs/rx.aggregates.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(function() {
            var stream1 = Rx.Observable.generateWithRelativeTime(
                    1,
                    function(x) {return x<=10;},
                    function(x) {return x + 1;},
                    function(x) {return x;},
                    function(x) {return 500;}
            );
            stream1 //.count()
                    //.sum()
                    //.average()
                    //.aggregate(0,function(l,r) { return l+r; })
                    .aggregate("",function(l,r) { return l+ "," + r; })
                    .doAction(function(x) {
                        $("#result").append(x);
                    })
                    .subscribe();
        });
    </script>
</head>

<body style="font-family: Consolas, monospace;">
<div id="result"></div>
</body>
</html>
