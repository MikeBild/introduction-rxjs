<!DOCTYPE html>
<head>
    <title>RxJs!</title>
    <script src="./libs/jquery-1.7.2.min.js" type="text/javascript"></script>
    <script src="./libs/rx.min.js" type="text/javascript"></script>
    <script src="./libs/rx.jquery.min.js" type="text/javascript"></script>
    <script src="./libs/rx.time.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(function() {
            var stream1 = Rx.Observable.range(1,10);
            var stream2 = Rx.Observable.range(1,10);
            var stream3 = Rx.Observable.interval(2000).select(function(x) { return "A";});
            var stream4 = Rx.Observable.interval(1000).select(function(x) { return "B";});

            var stream5 = $(document).keyupAsObservable().select(function(x) { return String.fromCharCode(x.keyCode);});

            stream1.merge(stream2).subscribe(function(x) {
                $("#result1").append(x);
            })
            stream1.concat(stream2).subscribe(function(x) {
                $("#result2").append(x);
            })
            stream1.zip(stream2,function (x, y) { return "First:" + x +", Second: "+ y; }).subscribe(function(x) {
                $("#result3").append(x);
            });

            stream3.merge(stream4).merge(stream5).subscribe(function(x) {
                $("#result4").append(x);
            })
            stream3.concat(stream4).subscribe(function(x) {
                $("#result5").append(x);
            })
            stream3.amb(stream5).subscribe(function(x) {
                $("#result6").append(x);
            });
            stream3.zip(stream4,function (x, y) { return { First:x , Second: y }; }).subscribe(function(x) {
                $("#result7").append(JSON.stringify(x));
            });
            stream3.combineLatest(stream5,function (x, y) { return { First:x , Second: y }; }).subscribe(function(x) {
                $("#result8").append(JSON.stringify(x));
            });
        });
    </script>
</head>

<body style="font-family: Consolas, monospace;">
<hr><h1>Merge</h1>
<div id="result1"></div>
<hr><h1>Concat</h1>
<div id="result2"></div>
<hr><h1>Zip</h1>
<div id="result3"></div>
<hr><h1>Merge Streamed</h1>
<div id="result4"></div>
<hr><h1>Concat Streamed</h1>
<div id="result5"></div>
<hr><h1>Amb Streamed</h1>        <div id="result6"></div>
<hr><h1>Zip Streamed</h1>
<div id="result7"></div>
<hr><h1>CombineLatest Streamed</h1>
<div id="result8"></div>
</body>
</html>
