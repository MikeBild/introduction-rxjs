<!DOCTYPE html>
    <head>
        <title>RxJs!</title>   
        <script src="./libs/jquery-1.7.2.min.js" type="text/javascript"></script>
        <script src="./libs/rx.min.js" type="text/javascript"></script>
        <script src="./libs/rx.jquery.min.js" type="text/javascript"></script>
		<script src="./libs/rx.time.min.js" type="text/javascript"></script>
        <script type="text/javascript">

        var go = function(value) {
            sleep(2000);
            return "AsyncResult" + value;
        }
		$(function() {
            Rx.Observable
                    .toAsync(go)(" is done!")
                    .subscribe(function(x){
                        $("#result2").text(x);
                    })

            $("#result1").text("Start!");
        });

        function sleep(milliseconds) {
            var start = new Date().getTime();
            for (var i = 0; i < 1e7; i++) {
                if ((new Date().getTime() - start) > milliseconds){
                    break;
                }
            }
        }
        </script>

    </head>

    <body style="font-family: Consolas, monospace;">
        <div id="result1"></div>
        <h1>Async Result</h1>
        <div id="result2"></div>
    </body>
</html>
