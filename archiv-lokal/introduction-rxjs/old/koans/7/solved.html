<!DOCTYPE html>
<head>
    <title>RxJs!</title>
    <script src="./libs/jquery-1.7.2.min.js" type="text/javascript"></script>
    <script src="./libs/rx.min.js" type="text/javascript"></script>
    <script src="./libs/rx.jquery.min.js" type="text/javascript"></script>
    <script src="./libs/rx.time.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(function() {
            var stream1 = Rx.Observable.interval(1000).select(function(x) { return "A";});
            var stream2 = $(document).keyupAsObservable().select(function(x) { return String.fromCharCode(x.keyCode);});

            stream1.sample(3000)
                    .doAction(function(x) {
                        $("#result1").append(x);
                    })
                    .subscribe();

            stream2
                    .doAction(function(x) {
                        $("#result2").append(x);
                    })
                    .subscribe();

            stream2.delay(500)
                    .doAction(function(x) {
                        $("#result3").append(x);
                    })
                    .subscribe();

            stream2.throttle(200)
                    //.distinctUntilChanged()
                    .doAction(function(x) {
                        $("#result4").append(x);
                    })
                    .subscribe();

            var stream3 = Rx.Observable.timer(4000,500).select(function(x) { return "Timer";});
            stream3
                    .doAction(function(x) {
                        $("#result5").append(x);
                    })
                    .subscribe();

            Rx.Observable.generateWithRelativeTime(
                    1,
                    function(x) {return x<=100;},
                    function(x) {return x + 1;},
                    function(x) {return x;},
                    function(x) {return 1000;})
                    .doAction(function(x) {
                        $("#result6").append(x);
                    })
                    .subscribe();
        });
    </script>
</head>

<body style="font-family: Consolas, monospace;">
<h1>Sample out</h1>
<div id="result1"></div>
<h1>Source</h1>
<div id="result2"></div>
<h1>Delay</h1>
<div id="result3"></div>
<h1>Throttle</h1>
<div id="result4"></div>
<h1>Timer</h1>
<div id="result5"></div>
<h1>Generate with Time</h1>
<div id="result6"></div>
</body>
</html>
